[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests" makes the helper module importable; "." makes custom_components
# importable when pytest is run as a console script (python -m pytest adds the
# current directory to sys.path by itself, the console script does not).
pythonpath = ["tests", "."]
asyncio_mode = "auto"
# tests/conftest.py re-enables sockets (the Home Assistant plugin blocks them);
# this suite talks to a real upstream HTTP server on 127.0.0.1.
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
